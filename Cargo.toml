[package]
name = "msgpack-rpc-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed MessagePack-RPC between equal Tokio peers"
license = "MIT"

[features]
default = []
cli = ["dep:clap", "dep:serde_json", "tokio/net", "tokio/io-std", "tokio/fs", "tokio/process", "tokio/signal"]

[[bin]]
name = "mrpc"
path = "src/bin/mrpc.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "=4.5.61", features = ["derive", "env"], optional = true }
serde_json = { version = "1.0", optional = true }
rmp = "0.8"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "rt", "sync", "macros", "time"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["time", "net", "process", "io-std"] }

[[test]]
name = "subprocess"
harness = false

[package]
name = "msgpack-rpc-peer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed MessagePack-RPC between equal Tokio peers"

[dependencies]
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["io-util", "rt", "sync", "macros"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["time", "net"] }
